# Nginx upload limits for CityCost (citycost.online)
#
# Production nginx defaults to client_max_body_size 1m, which rejects image uploads
# before they reach Node/Express. Apply this in the server {} or location /api/ block.
#
# On EC2:
#   sudo cp deploy/nginx-citycost-uploads.conf /etc/nginx/conf.d/citycost-uploads.conf
#   sudo nginx -t && sudo systemctl reload nginx

client_max_body_size 50m;

# Optional: increase proxy timeouts for large uploads on slow connections
proxy_read_timeout 120s;
proxy_send_timeout 120s;
