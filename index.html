    <!-- ── JSON-LD: Organization ─────────────────────────────────────────── -->
    <script type="application/ld+json" data-schema="organization">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "CityCost Global",
      "url": "https://citycost.online",
      "logo": {
        "@type": "ImageObject",
        "url": "https://citycost.online/logo.png",
        "width": 200,
        "height": 60
      },
      "sameAs": [
        "https://twitter.com/citycostglobal",
        "https://www.facebook.com/citycostglobal"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "url": "https://citycost.online"
      }
    }
    </script>

    <!-- ── JSON-LD: WebSite + SearchAction ───────────────────────────────── -->
    <script type="application/ld+json" data-schema="website">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "CityCost Global",
      "url": "https://citycost.online",
      "description": "Compare the cost of living between any two cities worldwide. Analyze rent, groceries, purchasing power, salaries, utilities, and restaurant prices side by side.",
      "inLanguage": "en-US",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://citycost.online/compare/{search_term_string}-vs-{search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- ── JSON-LD: WebPage (home default; overridden client-side) ────────── -->
    <script type="application/ld+json" data-schema="webpage">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "name": "Free Cost of Living Calculator - Compare Cities Worldwide | CityCost Global",
      "description": "Compare the cost of living between any two cities worldwide. Get side-by-side rent, groceries, restaurant, transport, utilities, salary and purchasing power data.",
      "url": "https://citycost.online",
      "inLanguage": "en-US",
      "isPartOf": { "@type": "WebSite", "url": "https://citycost.online", "name": "CityCost Global" },
      "publisher": { "@type": "Organization", "name": "CityCost Global", "url": "https://citycost.online" }
    }
    </script>

    <!-- ── Dark Mode Init (before React hydrates to prevent flash) ─────────── -->
    <script>
      try {
        var storedTheme = localStorage.getItem('col_theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (storedTheme === 'dark' || (!storedTheme && prefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
      document.documentElement.classList.add('js');
    </script>

    <!--
      FOUC guard: never hide #root. Crawlable SSR prose lives in #seo-prerender
      (sibling). For JS browsers, clip it off-screen so first paint is never the
      unstyled SEO dump. React mounts into an empty #root; main.tsx removes the
      sibling. Content remains in HTML source for crawlers. No-JS still sees it.
    -->
    <style>
      body {
        margin: 0;
        background-color: #f8fafc;
        color: #1e293b;
      }
      html.dark body {
        background-color: #020617;
        color: #e2e8f0;
      }
      @media screen {
        html.js #seo-prerender {
          position: absolute !important;
          width: 1px !important;
          height: 1px !important;
          padding: 0 !important;
          margin: -1px !important;
          overflow: hidden !important;
          clip: rect(0, 0, 0, 0) !important;
          white-space: nowrap !important;
          border: 0 !important;
        }
      }
    </style>

    <!-- ── Google Consent Mode v2 ─────────────────────────────────────────── -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { window.dataLayer.push(arguments); }

      var initialConsent = 'denied';
      try {
        var stored = localStorage.getItem('gdpr-consent');
        if (stored === 'granted' || stored === 'denied') {
          initialConsent = stored;
        }
      } catch (e) {}

      gtag('consent', 'default', {
        'ad_storage': initialConsent,
        'analytics_storage': initialConsent,
        'ad_user_data': initialConsent,
        'ad_personalization': initialConsent
      });
    </script>

    <!-- ── Google Analytics 4 ─────────────────────────────────────────────── -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-BH9GYL0N7W"></script>
    <script>
      gtag('js', new Date());
      gtag('config', 'G-BH9GYL0N7W', {
        page_title: document.title,
        page_location: window.location.href
      });
    </script>

    <!-- ── Google AdSense ─────────────────────────────────────────────────── -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
