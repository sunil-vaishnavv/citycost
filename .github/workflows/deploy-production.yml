name: Deploy Production (AWS)

on:
  push:
    branches:
      - main

concurrency:
  group: citycost-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to citycost-production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure SSH
        env:
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
        run: |
          set -euo pipefail
          echo "Configuring SSH for production deploy"
          if [[ -z "${PRODUCTION_SSH_KEY:-}" || -z "${PRODUCTION_SSH_HOST:-}" ]]; then
            echo "ERROR: Missing PRODUCTION_SSH_KEY or PRODUCTION_SSH_HOST GitHub secrets."
            exit 1
          fi
          echo "SSH host: ${PRODUCTION_SSH_HOST}"
          echo "SSH key file: ~/.ssh/id_deploy"
          mkdir -p ~/.ssh
          printf '%s\n' "$PRODUCTION_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "Running: ssh-keyscan -H \"${PRODUCTION_SSH_HOST}\""
          ssh-keyscan -H "$PRODUCTION_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH configuration complete"

      - name: Sync application to production
        env:
          PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail
          USER="${PRODUCTION_SSH_USER:-ubuntu}"
          TARGET="${USER}@${PRODUCTION_SSH_HOST}:/opt/citycost/"
          RSYNC_SSH="ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes"
          echo "Syncing repository to production"
          echo "  Source: ./"
          echo "  Target: ${TARGET}"
          echo "  Command: rsync -az --delete (with excludes) -e \"${RSYNC_SSH}\""
          rsync -az --delete \
            --exclude '.env' \
            --exclude 'node_modules/' \
            --exclude 'data/' \
            --exclude 'dist/' \
            --exclude '.git/' \
            --exclude '.deploy-commit' \
            -e "$RSYNC_SSH" \
            ./ "${TARGET}"
          echo "Rsync completed successfully"

      - name: Build and restart on server
        env:
          PRODUCTION_SSH_HOST: ${{ secrets.PRODUCTION_SSH_HOST }}
          PRODUCTION_SSH_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail
          USER="${PRODUCTION_SSH_USER:-ubuntu}"
          REMOTE="${USER}@${PRODUCTION_SSH_HOST}"
          DEPLOY_SHA="${{ github.sha }}"
          REMOTE_CMD="chmod +x /opt/citycost/scripts/deploy-production.sh && /opt/citycost/scripts/deploy-production.sh '${DEPLOY_SHA}'"
          echo "Running remote deploy script"
          echo "  Host: ${REMOTE}"
          echo "  Commit: ${DEPLOY_SHA}"
          echo "  Command: ${REMOTE_CMD}"
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes \
            "${REMOTE}" \
            "${REMOTE_CMD}"
          echo "Remote build and restart completed"

      - name: Public health checks
        run: |
          set -euo pipefail
          TMP_DIR="${RUNNER_TEMP:-/tmp}/citycost-health"
          mkdir -p "${TMP_DIR}"

          check_url() {
            local url="$1"
            local err_file="${TMP_DIR}/curl-$(echo -n "$url" | cksum | awk '{print $1}').err"
            local body_file="${TMP_DIR}/body-$(echo -n "$url" | cksum | awk '{print $1}').html"
            echo "Checking ${url}"
            local code
            code=$(curl -sS -L --retry 3 --retry-delay 2 \
              -o "${body_file}" \
              -w "%{http_code}" \
              "${url}" 2>"${err_file}") || {
              echo "ERROR: curl failed for ${url} (exit $?)"
              if [[ -s "${err_file}" ]]; then
                echo "curl stderr:"
                cat "${err_file}"
              fi
              return 1
            }
            echo "  HTTP ${code} · $(wc -c < "${body_file}" | tr -d ' ') bytes"
            if [[ "${code}" != "200" ]]; then
              echo "ERROR: Expected HTTP 200, got ${code} for ${url}"
              echo "Response preview:"
              head -c 500 "${body_file}" || true
              echo
              return 1
            fi
          }

          for url in \
            "https://citycost.online/health" \
            "https://citycost.online/api/health" \
            "https://citycost.online/" \
            "https://www.citycost.online/health"
          do
            check_url "${url}"
          done
          echo "All public health checks passed"

      - name: Verify deploy marker in production HTML
        run: |
          set -euo pipefail
          MARKER="citycost-deploy-marker"
          URL="https://citycost.online/"
          TMP_DIR="${RUNNER_TEMP:-/tmp}/citycost-deploy-verify"
          HTML_FILE="${TMP_DIR}/homepage.html"
          ERR_FILE="${TMP_DIR}/curl.err"

          echo "Verifying deploy marker in production HTML"
          echo "  URL: ${URL}"
          echo "  Marker: ${MARKER}"
          echo "  Output directory: ${TMP_DIR}"
          echo "  Output file: ${HTML_FILE}"

          mkdir -p "${TMP_DIR}"

          # Write to a file instead of piping to grep — piping with pipefail causes
          # curl exit 23 (CURLE_WRITE_ERROR) when grep -q closes the pipe early.
          if ! curl -fsSL --retry 3 --retry-delay 2 \
            -o "${HTML_FILE}" \
            "${URL}" 2>"${ERR_FILE}"; then
            curl_exit=$?
            echo "ERROR: curl failed (exit ${curl_exit}) downloading ${URL}"
            if [[ -s "${ERR_FILE}" ]]; then
              echo "curl stderr:"
              cat "${ERR_FILE}"
            fi
            if [[ -f "${HTML_FILE}" ]]; then
              echo "Partial response ($(wc -c < "${HTML_FILE}" | tr -d ' ') bytes, first 500 chars):"
              head -c 500 "${HTML_FILE}" || true
              echo
            fi
            exit 1
          fi

          bytes=$(wc -c < "${HTML_FILE}" | tr -d ' ')
          echo "Downloaded ${bytes} bytes from ${URL}"

          if [[ "${bytes}" -eq 0 ]]; then
            echo "ERROR: Empty HTML response from ${URL}"
            exit 1
          fi

          if ! grep -q "${MARKER}" "${HTML_FILE}"; then
            echo "ERROR: Deploy marker '${MARKER}' not found in production HTML"
            echo "Response preview (first 800 chars):"
            head -c 800 "${HTML_FILE}" || true
            echo
            exit 1
          fi

          echo "Deploy marker '${MARKER}' found — production HTML verified"

      - name: Deployment summary
        if: success()
        run: |
          echo "Deployed commit ${{ github.sha }} to https://citycost.online"
